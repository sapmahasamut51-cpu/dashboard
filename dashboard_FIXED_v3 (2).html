<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Dashboard ยอดหนี้นักเรียน</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1;
            --red: #ef4444; --green: #10b981; --amber: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 24px; border-radius: 14px; text-align: center;
            margin-bottom: 24px; box-shadow: 0 8px 24px rgba(99,102,241,0.3);
        }
        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .last-sync { font-size: 13px; opacity: 0.9; display:flex; align-items:center; justify-content:center; gap:8px; }
        .status-dot { width:8px; height:8px; border-radius:50%; background:#10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
        .scard { padding:20px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
        .scard-label { font-size:14px; margin-bottom:8px; opacity:0.9; }
        .scard-value { font-size:32px; font-weight:bold; }
        .scard-sub { font-size:13px; margin-top:4px; opacity:0.85; }
        .debt-card { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .students-card { background: linear-gradient(135deg, #10b981, #059669); }

        .search-box {
            width: 100%; max-width: 600px; margin: 0 auto 24px; display:block;
            padding: 12px 20px; background: var(--surface); border: 2px solid var(--surface2);
            border-radius: 10px; color: var(--text); font-size: 16px; transition: border-color 0.3s;
        }
        .search-box:focus { outline:none; border-color: var(--accent); }

        .class-section { margin-bottom: 24px; }
        .class-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 16px 24px; border-radius: 14px 14px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .class-title { font-size: 22px; font-weight: bold; }
        .class-total { font-size: 24px; font-weight: bold; color: #fbbf24; }
        .room-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(380px,1fr)); gap:16px; padding:16px; background: var(--surface); border-radius: 0 0 14px 14px; }
        .room-card { background: var(--bg); border-radius: 10px; overflow:hidden; }
        .room-header { background: var(--surface2); padding: 12px 16px; display:flex; justify-content:space-between; align-items:center; }
        .room-name { font-size: 16px; font-weight: bold; }
        .room-total { font-size: 18px; font-weight: bold; color: var(--amber); }

        .stable { width:100%; border-collapse:collapse; }
        .stable th { padding:10px 12px; text-align:left; font-size:13px; color:var(--muted); border-bottom:2px solid var(--surface2); background:var(--surface); }
        .stable th:last-child { text-align:right; }
        .stable td { padding:10px 12px; font-size:14px; cursor:pointer; }
        .stable tr:active td { background: var(--surface2); }
        .stable tr.debt-yellow td { background: #713f12; color: #fef3c7; }
        .stable tr.debt-orange td { background: #7c2d12; color: #fed7aa; font-weight:600; }
        .stable tr.debt-red td { background: #7f1d1d; color: #fecaca; font-weight:600; }
        .stable .code { color:var(--muted); font-size:13px; }
        .stable .debt { text-align:right; font-weight:bold; font-size:15px; }

        .sync-btn {
            position:fixed; bottom:24px; right:24px; width:54px; height:54px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border:none; border-radius:50%; font-size:24px; color:white; cursor:pointer;
            box-shadow: 0 4px 16px rgba(99,102,241,0.4); z-index:1000;
            bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
            -webkit-appearance: none;
        }
        .sync-btn.syncing { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading { text-align:center; padding:60px; color:var(--muted); }
        .spinner { width:40px; height:40px; border:4px solid var(--surface2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }

        /* ========== MODAL - iOS SAFE ========== */
        /* ⭐ KEY FIX: ไม่ใช้ display:flex, ไม่ใช้ touch-action, ไม่ใช้ touchend preventDefault */
        .modal-overlay {
            display:none; 
            position:fixed; 
            top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.85);
            z-index:9999; 
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
        }
        .modal-overlay.active { 
            display:block;
        }
        .modal {
            background: var(--surface); 
            border-radius:16px; 
            padding:24px;
            max-width:800px; 
            width: calc(100% - 20px);
            margin: 20px auto 100px auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5); 
            animation: modalIn 0.25s ease-out;
            position: relative;
        }
        @keyframes modalIn { from { transform:translateY(-30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        
        .modal-head { 
            display:flex; justify-content:space-between; align-items:center; 
            margin-bottom:20px; padding-bottom:16px; border-bottom:2px solid var(--surface2); 
        }
        .modal-head h2 { font-size:1.4em; flex:1; margin-right:12px; word-break:break-word; }
        .modal-close { 
            background:var(--red); color:white; border:none; 
            width:48px; height:48px; border-radius:50%; 
            font-size:24px; cursor:pointer; 
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            -webkit-appearance: none;
            appearance: none;
        }
        .modal-close:active { background:#dc2626; transform: scale(0.9); }

        .debt-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 20px; border-radius: 12px; text-align:center; margin-bottom:20px;
        }
        .debt-badge .label { font-size:14px; opacity:0.9; }
        .debt-badge .amount { font-size:2.2em; font-weight:bold; margin:6px 0; }

        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
        .info-item { background:var(--bg); padding:12px; border-radius:8px; }
        .info-item .lbl { color:var(--muted); font-size:12px; margin-bottom:4px; }
        .info-item .val { font-size:15px; font-weight:600; }

        /* ⭐ Tabs - ใช้ <button> ไม่ใช่ <div> เพื่อให้ iOS กดได้ */
        .tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--bg); border-radius:10px; padding:4px; }
        .tab-btn { 
            flex:1; padding:12px; text-align:center; border-radius:8px; 
            cursor:pointer; font-size:14px; font-weight:600; 
            color:var(--muted); background:transparent; border:none;
            -webkit-appearance: none; appearance: none;
        }
        .tab-btn.active { background:var(--accent); color:white; }
        .tab-btn:active { opacity:0.8; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Calendar */
        .cal-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .cal-nav button { 
            background:var(--surface2); border:none; color:white; 
            padding:10px 18px; border-radius:6px; cursor:pointer; 
            font-size:18px; font-weight: bold;
            min-width:48px; min-height:48px;
            -webkit-appearance: none; appearance: none;
        }
        .cal-nav button:active { background:var(--accent); }
        .cal-nav .month-label { font-size:15px; font-weight:bold; }
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:12px; }
        .cal-day-name { text-align:center; font-size:11px; color:var(--muted); padding:4px; }
        .cal-day {
            text-align:center; padding:10px 4px; border-radius:6px; cursor:pointer;
            font-size:14px; color:var(--muted);
            min-height:44px;
            display:flex; align-items:center; justify-content:center;
            -webkit-user-select: none; user-select: none;
        }
        .cal-day:active:not(.empty) { background:var(--surface2); }
        .cal-day.has-data { 
            background: linear-gradient(135deg, #fbbf24, #f59e0b) !important; 
            color: #78350f !important; font-weight:bold !important;
            border: 2px solid #fcd34d !important;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5) !important;
        }
        .cal-day.selected { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6) !important; 
            color: white !important;
            border: 2px solid #818cf8 !important;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.6) !important;
        }
        .cal-day.today { border: 2px solid #10b981 !important; }
        .cal-day.empty { cursor:default; }

        .hist-item {
            background:var(--bg); padding:16px; border-radius:10px; margin-bottom:12px;
            border-left:5px solid var(--amber);
        }
        .hist-item.payment { border-left-color: var(--green); }
        .hist-amount { font-weight:bold; font-size:2em; color:var(--amber); margin-bottom:12px; }
        .hist-amount.payment { color:var(--green); }
        
        .product-table { width:100%; margin-top:12px; border-collapse: collapse; }
        .product-table th {
            background:var(--surface2); padding:10px; text-align:left;
            font-size:14px; font-weight:600; border-bottom:2px solid var(--accent);
        }
        .product-table th:last-child { text-align:right; }
        .product-table td { padding:10px; font-size:16px; border-bottom:1px solid var(--surface2); }
        .product-table td:first-child { color:var(--text); font-weight:500; }
        .product-table td:last-child { text-align:right; color:var(--amber); font-weight:bold; font-size:17px; }
        .product-table tr:last-child td { border-bottom:none; }
        
        .hist-meta { color:var(--muted); font-size:13px; margin-top:8px; }
        .hist-empty { text-align:center; padding:30px; color:var(--muted); }
        .selected-date-label { background:var(--accent); color:white; padding:8px 14px; border-radius:8px; text-align:center; margin-bottom:12px; font-weight:bold; font-size:14px; }
        .hist-summary { background: linear-gradient(135deg, var(--amber), #d97706); padding:12px; border-radius:8px; text-align:center; margin-bottom:12px; color:white; }

        @media (max-width:768px) {
            .room-grid { grid-template-columns:1fr; }
            .header h1 { font-size:20px; }
            .info-grid { grid-template-columns:1fr; }
            .modal { 
                padding: 16px; 
                width: calc(100% - 16px);
                margin: 10px auto 120px auto;
            }
            .modal-head h2 { font-size:1.2em; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Dashboard ยอดหนี้นักเรียน</h1>
        <div class="last-sync" id="lastSync"><span class="status-dot"></span><span>กำลังโหลด...</span></div>
    </div>

    <div class="summary">
        <div class="scard debt-card">
            <div class="scard-label">ยอดหนี้รวมทั้งหมด</div>
            <div class="scard-value" id="totalDebt">฿0</div>
            <div class="scard-sub" id="debtCount">0 คน</div>
        </div>
        <div class="scard students-card">
            <div class="scard-label">นักเรียนทั้งหมด</div>
            <div class="scard-value" id="totalStudents">0</div>
            <div class="scard-sub">คน</div>
        </div>
    </div>

    <input type="text" class="search-box" id="searchBox" placeholder="ค้นหา ชื่อ, รหัส, ชั้น, ห้อง...">

    <div id="content"><div class="loading"><div class="spinner"></div><div>กำลังโหลดข้อมูล...</div></div></div>

    <button class="sync-btn" type="button" onclick="syncData()">&#x1f504;</button>
</div>

<!-- Student Detail Modal -->
<div id="studentModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-head">
            <h2 id="mName">-</h2>
            <button class="modal-close" type="button" onclick="event.stopPropagation();closeModal()">&times;</button>
        </div>

        <div class="debt-badge">
            <div class="label">ยอดหนี้คงเหลือ</div>
            <div class="amount" id="mDebt">฿0</div>
        </div>

        <div class="info-grid">
            <div class="info-item"><div class="lbl">รหัสนักเรียน</div><div class="val" id="mCode">-</div></div>
            <div class="info-item"><div class="lbl">ชั้น/ห้อง</div><div class="val" id="mClass">-</div></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" type="button" onclick="event.stopPropagation();switchTab('purchases')" id="tabBtnPurchases">ประวัติการซื้อ</button>
            <button class="tab-btn" type="button" onclick="event.stopPropagation();switchTab('payments')" id="tabBtnPayments">การชำระเงิน</button>
        </div>

        <div id="tab-purchases" class="tab-content active">
            <div id="calendarContainer"></div>
            <div id="purchaseList"></div>
        </div>

        <div id="tab-payments" class="tab-content">
            <div id="paymentList"></div>
        </div>
    </div>
</div>

<script>
var webAppUrl = 'https://script.google.com/macros/s/AKfycbzQl8z6eYrBKzQB-23CbeU4km8JYm-NY9zSsD6HMKYVB22l1a6roqAhEYhYnvRUkBD_/exec';

var allData = [], studentsData = [], isLoading = false;
var currentStudent = null;
var calYear, calMonth, purchaseDates = {};
var savedScrollY = 0;

// ==================== DATA ====================
async function loadData() {
    if (isLoading) return;
    isLoading = true;
    try {
        var r = await fetch(webAppUrl + '?action=get_students&t=' + Date.now());
        var res = await r.json();
        if (res.success) {
            allData = res.students || res.data || [];
            filterAndUpdate();
            document.getElementById('lastSync').innerHTML = '<span class="status-dot"></span><span>อัพเดท: ' + new Date().toLocaleString('th-TH') + '</span>';
        }
    } catch(e) {
        console.error('Load error:', e);
        document.getElementById('content').innerHTML = '<div style="background:#7f1d1d;color:#fecaca;padding:24px;border-radius:12px;text-align:center"><h3>ไม่สามารถดึงข้อมูล</h3><p style="margin-top:10px">' + e.message + '</p><button type="button" onclick="location.reload()" style="margin-top:16px;padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px">ลองใหม่</button></div>';
    }
    isLoading = false;
}

function filterAndUpdate() {
    var q = document.getElementById('searchBox').value.toLowerCase();
    studentsData = q === '' ? allData.slice() : allData.filter(function(s) {
        return s.name.toLowerCase().indexOf(q) >= 0 || s.code.toLowerCase().indexOf(q) >= 0 ||
            s.class.toLowerCase().indexOf(q) >= 0 || s.room.toLowerCase().indexOf(q) >= 0;
    });
    updateDashboard();
}

function updateDashboard() {
    if (!studentsData.length) {
        document.getElementById('content').innerHTML = '<div class="loading" style="padding:40px"><span style="font-size:16px;color:#64748b">ไม่พบข้อมูล</span></div>';
        return;
    }
    var total = 0, withDebt = 0;
    for (var i = 0; i < studentsData.length; i++) {
        total += studentsData[i].debt;
        if (studentsData[i].debt > 0) withDebt++;
    }
    document.getElementById('totalDebt').textContent = '฿' + total.toLocaleString();
    document.getElementById('debtCount').textContent = withDebt + ' คน';
    document.getElementById('totalStudents').textContent = studentsData.length;
    renderTables();
}

function renderTables() {
    var byClass = {};
    studentsData.forEach(function(s) {
        if (!byClass[s.class]) byClass[s.class] = {};
        if (!byClass[s.class][s.room]) byClass[s.class][s.room] = [];
        byClass[s.class][s.room].push(s);
    });

    var html = '';
    Object.keys(byClass).sort(function(a,b) {
        return (parseInt(a.replace(/\D/g,''))||0) - (parseInt(b.replace(/\D/g,''))||0);
    }).forEach(function(cls) {
        var rooms = byClass[cls];
        var classTotal = 0;
        Object.values(rooms).forEach(function(arr) { arr.forEach(function(x) { classTotal += x.debt; }); });
        html += '<div class="class-section"><div class="class-header"><div class="class-title">ชั้น ' + cls + '</div><div class="class-total">฿' + classTotal.toLocaleString() + '</div></div><div class="room-grid">';

        Object.keys(rooms).sort().forEach(function(room) {
            var sts = rooms[room].sort(function(a,b) { return (parseInt(a.code)||0) - (parseInt(b.code)||0); });
            var roomTotal = 0;
            sts.forEach(function(x) { roomTotal += x.debt; });
            html += '<div class="room-card"><div class="room-header"><div class="room-name">ห้อง ' + room + '</div><div class="room-total">฿' + roomTotal.toLocaleString() + '</div></div><table class="stable"><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ-สกุล</th><th style="text-align:right">ยอดหนี้</th></tr></thead><tbody>';

            sts.forEach(function(s, i) {
                var rc = s.debt > 500 ? 'debt-red' : s.debt > 300 ? 'debt-orange' : s.debt > 0 ? 'debt-yellow' : '';
                var ne = s.name.replace(/'/g, "\\'");
                html += '<tr class="' + rc + '" onclick="openModal(\'' + s.code + "','" + ne + "','" + s.debt + "','" + cls + "','" + room + "')\">" +
                    '<td>' + (i+1) + '</td><td class="code">' + s.code + '</td><td>' + s.name + '</td><td class="debt">฿' + s.debt.toLocaleString() + '</td></tr>';
            });
            html += '</tbody></table></div>';
        });
        html += '</div></div>';
    });
    document.getElementById('content').innerHTML = html;
}

document.getElementById('searchBox').addEventListener('input', filterAndUpdate);

function syncData() {
    var btn = document.querySelector('.sync-btn');
    if (btn) btn.classList.add('syncing');
    isLoading = false;
    loadData();
    setTimeout(function() { if (btn) btn.classList.remove('syncing'); }, 1000);
}

// ==================== MODAL ====================
function openModal(code, name, debt, cls, room) {
    currentStudent = { code: code, name: name, debt: parseFloat(debt)||0 };
    document.getElementById('mName').textContent = name;
    document.getElementById('mDebt').textContent = '฿' + (parseFloat(debt)||0).toLocaleString();
    document.getElementById('mCode').textContent = code;
    document.getElementById('mClass').textContent = cls + ' / ' + room;
    
    savedScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
    
    var modal = document.getElementById('studentModal');
    modal.classList.add('active');
    modal.scrollTop = 0;
    
    // ⭐ ซ่อน body scroll แบบ simple (ไม่ใช้ position:fixed ที่ทำ iOS พัง)
    document.body.style.overflow = 'hidden';

    switchTab('purchases');

    var now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    purchaseDates = {};

    loadPurchases(code);
    loadPayments(code);
}

function closeModal() {
    document.getElementById('studentModal').classList.remove('active');
    document.body.style.overflow = '';
    window.scrollTo(0, savedScrollY);
    currentStudent = null;
}

function switchTab(tab) {
    var bp = document.getElementById('tabBtnPurchases');
    var bpy = document.getElementById('tabBtnPayments');
    var tp = document.getElementById('tab-purchases');
    var tpy = document.getElementById('tab-payments');
    
    if (tab === 'purchases') {
        bp.classList.add('active'); bpy.classList.remove('active');
        tp.classList.add('active'); tpy.classList.remove('active');
    } else {
        bp.classList.remove('active'); bpy.classList.add('active');
        tp.classList.remove('active'); tpy.classList.add('active');
    }
}

// ==================== CALENDAR ====================
function renderCalendar(salesByDate) {
    var today = new Date();
    var first = new Date(calYear, calMonth, 1);
    var last = new Date(calYear, calMonth + 1, 0);
    var startDay = first.getDay();
    var daysInMonth = last.getDate();

    var monthNames = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    var dayNames = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    // ⭐ ใช้ onclick inline ทุกที่ - วิธีนี้ iOS กดได้ 100%
    var h = '<div class="cal-nav">' +
        '<button type="button" onclick="changeMonth(-1)">&#9664;</button>' +
        '<span class="month-label">' + monthNames[calMonth] + ' ' + (calYear + 543) + '</span>' +
        '<button type="button" onclick="changeMonth(1)">&#9654;</button>' +
        '</div><div class="cal-grid">';
    
    dayNames.forEach(function(d) { h += '<div class="cal-day-name">' + d + '</div>'; });
    for (var i = 0; i < startDay; i++) h += '<div class="cal-day empty"></div>';

    for (var d = 1; d <= daysInMonth; d++) {
        var dateKey = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var hasData = salesByDate && salesByDate[dateKey] && salesByDate[dateKey].length > 0;
        var isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
        var cls = 'cal-day';
        if (hasData) cls += ' has-data';
        if (isToday) cls += ' today';

        h += '<div class="' + cls + '" data-dk="' + dateKey + '" onclick="selectDate(\'' + dateKey + '\')">' + d + '</div>';
    }
    h += '</div>';
    document.getElementById('calendarContainer').innerHTML = h;
}

function changeMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar(purchaseDates);
}

function selectDate(dateKey) {
    document.querySelectorAll('.cal-day').forEach(function(el) { el.classList.remove('selected'); });
    var t = document.querySelector('.cal-day[data-dk="' + dateKey + '"]');
    if (t) t.classList.add('selected');

    var items = purchaseDates[dateKey] || [];
    var h = '<div class="selected-date-label">' + formatDateThai(dateKey) + '</div>';

    if (items.length === 0) {
        h += '<div class="hist-empty">ไม่มีรายการในวันนี้</div>';
    } else {
        var dayTotal = 0;
        items.forEach(function(x) { dayTotal += (parseFloat(x.amount)||0); });
        h += '<div class="hist-summary"><div style="font-size:12px;opacity:0.9">ยอดซื้อวันนี้</div><div style="font-size:1.6em;font-weight:bold">฿' + dayTotal.toLocaleString() + '</div><div style="font-size:12px;opacity:0.8">' + items.length + ' รายการ</div></div>';

        items.forEach(function(item) {
            var tm = item.time || '';
            var product = item.product || '';
            var amount = parseFloat(item.amount) || 0;
            
            h += '<div class="hist-item"><div style="width:100%"><div class="hist-amount">฿' + amount.toLocaleString() + '</div>';
            
            // ⭐ ถ้ามี items array (ราคาจริงแต่ละชิ้น)
            if (item.items && item.items.length > 0) {
                h += '<table class="product-table"><thead><tr><th>รายการ</th><th>ราคา</th></tr></thead><tbody>';
                item.items.forEach(function(prod) {
                    h += '<tr><td>' + (prod.name || 'สินค้า') + '</td><td>฿' + (prod.price || 0).toLocaleString() + '</td></tr>';
                });
                h += '</tbody></table>';
            }
            // ⭐ ไม่มี items → แสดงแค่ชื่อ (ไม่หารราคาเฉลี่ย)
            else if (product && product !== 'สินค้า' && product !== 'สินค้าทั่วไป') {
                var pList = product.split(',');
                var filtered = [];
                for (var pi = 0; pi < pList.length; pi++) {
                    var pp = pList[pi].trim();
                    if (pp) filtered.push(pp);
                }
                if (filtered.length > 0) {
                    h += '<table class="product-table"><thead><tr><th>รายการ</th></tr></thead><tbody>';
                    filtered.forEach(function(p) { h += '<tr><td>' + p + '</td></tr>'; });
                    h += '</tbody></table>';
                }
            }
            
            h += '<div class="hist-meta">' + tm + '</div></div></div>';
        });
    }
    document.getElementById('purchaseList').innerHTML = h;
}

function formatDateThai(dateKey) {
    var p = dateKey.split('-');
    var months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return parseInt(p[2]) + ' ' + months[parseInt(p[1])] + ' ' + (parseInt(p[0])+543);
}

// ==================== LOAD HISTORY ====================
async function loadPurchases(code) {
    var list = document.getElementById('purchaseList');
    list.innerHTML = '<div class="hist-empty"><div class="spinner"></div>กำลังโหลด...</div>';

    try {
        var r = await fetch(webAppUrl + '?action=getSalesHistory&studentCode=' + code + '&t=' + Date.now());
        var res = await r.json();

        if (res.success && res.history && res.history.length > 0) {
            purchaseDates = {};
            res.history.forEach(function(item) {
                var dt = new Date(item.datetime || item.timestamp || item.date);
                var key = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
                if (!purchaseDates[key]) purchaseDates[key] = [];
                purchaseDates[key].push({
                    amount: item.amount || item.price || 0,
                    time: dt.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'}),
                    product: item.product || item.item || item.name || '',
                    items: item.items || [],
                    date: key
                });
            });

            renderCalendar(purchaseDates);

            var now = new Date();
            var todayKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
            var sortedKeys = Object.keys(purchaseDates).sort();
            var latestDate = sortedKeys[sortedKeys.length - 1];
            var selectKey = purchaseDates[todayKey] ? todayKey : latestDate;

            if (selectKey) {
                var sp = selectKey.split('-');
                calYear = parseInt(sp[0]);
                calMonth = parseInt(sp[1]) - 1;
                renderCalendar(purchaseDates);
                selectDate(selectKey);
            }

        } else {
            renderCalendar({});
            list.innerHTML = '<div class="hist-empty">ยังไม่มีประวัติการซื้อ</div>';
        }
    } catch(e) {
        console.error('Sales history error:', e);
        renderCalendar({});
        list.innerHTML = '<div class="hist-empty">ไม่สามารถโหลดข้อมูลได้<br><button type="button" onclick="loadPurchases(\'' + code + '\')" style="margin-top:10px;padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px">ลองใหม่</button></div>';
    }
}

async function loadPayments(code) {
    var list = document.getElementById('paymentList');
    list.innerHTML = '<div class="hist-empty"><div class="spinner"></div>กำลังโหลด...</div>';

    try {
        var r = await fetch(webAppUrl + '?action=getPaymentHistory&studentCode=' + code + '&t=' + Date.now());
        var res = await r.json();

        if (res.success && res.history && res.history.length > 0) {
            var h = '';
            var totalPaid = 0;
            var histCopy = res.history.slice().reverse();
            histCopy.forEach(function(p) {
                var dt = new Date(p.datetime || p.timestamp || p.date);
                var dateStr = dt.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'});
                var timeStr = dt.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
                var amt = parseFloat(p.amount) || 0;
                totalPaid += amt;
                h += '<div class="hist-item payment"><div><div class="hist-amount payment">฿' + amt.toLocaleString() + '</div><div class="hist-meta">' + dateStr + ' ' + timeStr + '</div></div></div>';
            });

            h = '<div style="background:linear-gradient(135deg,var(--green),#059669);padding:12px;border-radius:8px;text-align:center;margin-bottom:12px;color:white"><div style="font-size:12px;opacity:0.9">ชำระแล้วทั้งหมด</div><div style="font-size:1.6em;font-weight:bold">฿' + totalPaid.toLocaleString() + '</div><div style="font-size:12px;opacity:0.8">' + res.history.length + ' ครั้ง</div></div>' + h;

            list.innerHTML = h;
        } else {
            list.innerHTML = '<div class="hist-empty">ยังไม่มีประวัติการชำระเงิน</div>';
        }
    } catch(e) {
        console.error('Payment history error:', e);
        list.innerHTML = '<div class="hist-empty">ไม่สามารถโหลดข้อมูลได้<br><button type="button" onclick="loadPayments(\'' + code + '\')" style="margin-top:10px;padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px">ลองใหม่</button></div>';
    }
}

// ==================== INIT ====================
window.addEventListener('load', function() {
    loadData();
    setInterval(function() { if (!isLoading) loadData(); }, 5000);
});
</script>
