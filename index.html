<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Dashboard ยอดหนี้นักเรียน</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1;
            --red: #ef4444; --green: #10b981; --amber: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 16px;
        }
        .container { max-width: 1600px; margin: 0 auto; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 24px; border-radius: 14px; text-align: center;
            margin-bottom: 24px; box-shadow: 0 8px 24px rgba(99,102,241,0.3);
        }
        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .last-sync { font-size: 13px; opacity: 0.9; display:flex; align-items:center; justify-content:center; gap:8px; }
        .status-dot { width:8px; height:8px; border-radius:50%; background:#10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Summary Cards */
        .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
        .scard { padding:20px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .scard:hover { transform: translateY(-3px); }
        .scard-label { font-size:14px; margin-bottom:8px; opacity:0.9; }
        .scard-value { font-size:32px; font-weight:bold; }
        .scard-sub { font-size:13px; margin-top:4px; opacity:0.85; }
        .debt-card { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .students-card { background: linear-gradient(135deg, #10b981, #059669); }

        /* Search */
        .search-box {
            width: 100%; max-width: 600px; margin: 0 auto 24px; display:block;
            padding: 12px 20px; background: var(--surface); border: 2px solid var(--surface2);
            border-radius: 10px; color: var(--text); font-size: 15px; transition: border-color 0.3s;
        }
        .search-box:focus { outline:none; border-color: var(--accent); }

        /* Class Section */
        .class-section { margin-bottom: 24px; }
        .class-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 16px 24px; border-radius: 14px 14px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .class-title { font-size: 22px; font-weight: bold; }
        .class-total { font-size: 24px; font-weight: bold; color: #fbbf24; }
        .room-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(380px,1fr)); gap:16px; padding:16px; background: var(--surface); border-radius: 0 0 14px 14px; }
        .room-card { background: var(--bg); border-radius: 10px; overflow:hidden; transition: transform 0.2s; }
        .room-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.25); }
        .room-header { background: var(--surface2); padding: 12px 16px; display:flex; justify-content:space-between; align-items:center; }
        .room-name { font-size: 16px; font-weight: bold; }
        .room-total { font-size: 18px; font-weight: bold; color: var(--amber); }

        /* Student Table */
        .stable { width:100%; border-collapse:collapse; }
        .stable th { padding:10px 12px; text-align:left; font-size:13px; color:var(--muted); border-bottom:2px solid var(--surface2); background:var(--surface); }
        .stable th:last-child { text-align:right; }
        .stable td { padding:10px 12px; font-size:14px; cursor:pointer; transition: background 0.15s; }
        .stable tr:hover td { background: var(--surface); }
        .stable tr.debt-yellow td { background: #713f12; color: #fef3c7; }
        .stable tr.debt-orange td { background: #7c2d12; color: #fed7aa; font-weight:600; }
        .stable tr.debt-red td { background: #7f1d1d; color: #fecaca; font-weight:600; }
        .stable .code { color:var(--muted); font-size:13px; }
        .stable .debt { text-align:right; font-weight:bold; font-size:15px; }

        /* Sync Button */
        .sync-btn {
            position:fixed; bottom:24px; right:24px; width:54px; height:54px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border:none; border-radius:50%; font-size:24px; color:white; cursor:pointer;
            box-shadow: 0 4px 16px rgba(99,102,241,0.4); z-index:1000; transition: all 0.3s;
        }
        .sync-btn:hover { transform: scale(1.1) rotate(90deg); }
        .sync-btn.syncing { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Loading */
        .loading { text-align:center; padding:60px; color:var(--muted); }
        .spinner { width:40px; height:40px; border:4px solid var(--surface2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }

        /* ========== MODAL ========== */
        .modal-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85);
            z-index:9999; overflow-y:auto; padding:20px;
        }
        .modal-overlay.active { display:flex; align-items:flex-start; justify-content:center; padding-top:40px; }
        .modal {
            background: var(--surface); border-radius:16px; padding:28px;
            max-width:800px; width:100%; max-height:85vh; overflow-y:auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5); animation: modalIn 0.25s ease-out;
        }
        @keyframes modalIn { from { transform:translateY(-30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:16px; border-bottom:2px solid var(--surface2); }
        .modal-head h2 { font-size:1.6em; }
        .modal-close { background:var(--red); color:white; border:none; width:40px; height:40px; border-radius:50%; font-size:1.5em; cursor:pointer; transition: transform 0.2s; }
        .modal-close:hover { transform: rotate(90deg) scale(1.1); }

        /* Debt Badge */
        .debt-badge {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 20px; border-radius: 12px; text-align:center; margin-bottom:20px;
        }
        .debt-badge .label { font-size:14px; opacity:0.9; }
        .debt-badge .amount { font-size:2.4em; font-weight:bold; margin:6px 0; }

        /* Info Grid */
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
        .info-item { background:var(--bg); padding:12px; border-radius:8px; }
        .info-item .lbl { color:var(--muted); font-size:12px; margin-bottom:4px; }
        .info-item .val { font-size:15px; font-weight:600; }

        /* Tabs */
        .tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--bg); border-radius:10px; padding:4px; }
        .tab { flex:1; padding:10px; text-align:center; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; transition: all 0.2s; color:var(--muted); }
        .tab.active { background:var(--accent); color:white; }
        .tab:hover:not(.active) { background:var(--surface2); color:var(--text); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Calendar */
        .cal-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .cal-nav button { background:var(--surface2); border:none; color:white; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
        .cal-nav button:hover { background:var(--accent); }
        .cal-nav .month-label { font-size:15px; font-weight:bold; }
        .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:12px; }
        .cal-day-name { text-align:center; font-size:11px; color:var(--muted); padding:4px; }
        .cal-day {
            text-align:center; padding:8px 4px; border-radius:6px; cursor:pointer;
            font-size:13px; transition: all 0.15s; color:var(--muted);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .cal-day:hover:not(.has-data):not(.selected) { background:var(--surface2); color:white; }
        .cal-day.has-data { 
            background: linear-gradient(135deg, #fbbf24, #f59e0b) !important; 
            color: #78350f !important; 
            font-weight:bold !important;
            border: 2px solid #fcd34d !important;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5) !important;
            animation: glow-pulse 2s ease-in-out infinite;
        }
        .cal-day.has-data:hover {
            background: linear-gradient(135deg, #fcd34d, #fbbf24) !important;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8) !important;
        }
        .cal-day.selected { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6) !important; 
            color: white !important;
            border: 2px solid #818cf8 !important;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.6) !important;
        }
        .cal-day.today { 
            border: 2px solid #10b981 !important;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 12px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.8); }
        }
        .cal-day.empty { cursor:default; }

        /* History Items */
        .hist-item {
            background:var(--bg); padding:16px; border-radius:10px; margin-bottom:12px;
            border-left:5px solid var(--amber);
        }
        .hist-item.payment { border-left-color: var(--green); }
        .hist-amount { 
            font-weight:bold; 
            font-size:2em; 
            color:var(--amber); 
            margin-bottom:12px;
        }
        .hist-amount.payment { color:var(--green); }
        
        /* ⭐ ตารางรายการสินค้า */
        .product-table {
            width:100%; 
            margin-top:12px;
            border-collapse: collapse;
        }
        .product-table th {
            background:var(--surface2);
            padding:10px;
            text-align:left;
            font-size:14px;
            font-weight:600;
            border-bottom:2px solid var(--accent);
        }
        .product-table th:last-child {
            text-align:right;
        }
        .product-table td {
            padding:10px;
            font-size:16px;
            border-bottom:1px solid var(--surface2);
        }
        .product-table td:first-child {
            color:var(--text);
            font-weight:500;
        }
        .product-table td:last-child {
            text-align:right;
            color:var(--amber);
            font-weight:bold;
            font-size:17px;
        }
        .product-table tr:last-child td {
            border-bottom:none;
        }
        .product-total {
            background:var(--surface2);
            padding:12px;
            border-radius:6px;
            margin-top:8px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .product-total .label {
            font-size:16px;
            font-weight:600;
        }
        .product-total .value {
            font-size:20px;
            font-weight:bold;
            color:var(--amber);
        }
        
        .hist-meta { color:var(--muted); font-size:13px; margin-top:8px; }
        .hist-empty { text-align:center; padding:30px; color:var(--muted); }

        .selected-date-label { background:var(--accent); color:white; padding:8px 14px; border-radius:8px; text-align:center; margin-bottom:12px; font-weight:bold; font-size:14px; }
        .hist-summary { background: linear-gradient(135deg, var(--amber), #d97706); padding:12px; border-radius:8px; text-align:center; margin-bottom:12px; color:white; }

        @media (max-width:768px) {
            .room-grid { grid-template-columns:1fr; }
            .header h1 { font-size:20px; }
            .info-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Dashboard ยอดหนี้นักเรียน</h1>
        <div class="last-sync" id="lastSync"><span class="status-dot"></span><span>กำลังโหลด...</span></div>
    </div>

    <div class="summary">
        <div class="scard debt-card">
            <div class="scard-label">💰 ยอดหนี้รวมทั้งหมด</div>
            <div class="scard-value" id="totalDebt">฿0</div>
            <div class="scard-sub" id="debtCount">0 คน</div>
        </div>
        <div class="scard students-card">
            <div class="scard-label">👥 นักเรียนทั้งหมด</div>
            <div class="scard-value" id="totalStudents">0</div>
            <div class="scard-sub">คน</div>
        </div>
    </div>

    <input type="text" class="search-box" id="searchBox" placeholder="🔍 ค้นหา ชื่อ, รหัส, ชั้น, ห้อง...">

    <div id="content"><div class="loading"><div class="spinner"></div><div>กำลังโหลดข้อมูล...</div></div></div>

    <button class="sync-btn" onclick="syncData()" title="รีเฟรช">🔄</button>
</div>

<!-- Student Detail Modal -->
<div id="studentModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-head">
            <h2 id="mName">-</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div class="debt-badge">
            <div class="label">💰 ยอดหนี้คงเหลือ</div>
            <div class="amount" id="mDebt">฿0</div>
        </div>

        <div class="info-grid">
            <div class="info-item"><div class="lbl">รหัสนักเรียน</div><div class="val" id="mCode">-</div></div>
            <div class="info-item"><div class="lbl">ชั้น/ห้อง</div><div class="val" id="mClass">-</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('purchases')">🛒 ประวัติการซื้อ</div>
            <div class="tab" onclick="switchTab('payments')">💳 การชำระเงิน</div>
        </div>

        <!-- Tab: Purchases -->
        <div id="tab-purchases" class="tab-content active">
            <div id="calendarContainer"></div>
            <div id="purchaseList"></div>
        </div>

        <!-- Tab: Payments -->
        <div id="tab-payments" class="tab-content">
            <div id="paymentList"></div>
        </div>
    </div>
</div>

<script>
const webAppUrl = 'https://script.google.com/macros/s/AKfycbzQl8z6eYrBKzQB-23CbeU4km8JYm-NY9zSsD6HMKYVB22l1a6roqAhEYhYnvRUkBD_/exec';

let allData = [], studentsData = [], isLoading = false, prevHash = '';
let currentStudent = null;
let calYear, calMonth, purchaseDates = {};

// ==================== DATA LOADING ====================
async function loadData() {
    if (isLoading) return;
    isLoading = true;
    try {
        const r = await fetch(webAppUrl + '?action=get_students&t=' + Date.now());
        const res = await r.json();
        if (res.success) {
            allData = res.students || res.data || [];
            filterAndUpdate();
            document.getElementById('lastSync').innerHTML = `<span class="status-dot"></span><span>อัพเดท: ${new Date().toLocaleString('th-TH')}</span>`;
        }
    } catch(e) {
        console.error('Load error:', e);
        document.getElementById('content').innerHTML = `<div style="background:#7f1d1d;color:#fecaca;padding:24px;border-radius:12px;text-align:center"><h3>❌ ไม่สามารถดึงข้อมูล</h3><p style="margin-top:10px">${e.message}</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer">🔄 ลองใหม่</button></div>`;
    }
    isLoading = false;
}

function filterAndUpdate() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    studentsData = q === '' ? [...allData] : allData.filter(s =>
        s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) ||
        s.class.toLowerCase().includes(q) || s.room.toLowerCase().includes(q)
    );
    updateDashboard();
}

function updateDashboard() {
    if (!studentsData.length) {
        document.getElementById('content').innerHTML = '<div class="loading" style="font-size:48px;padding:40px">🔭<br><span style="font-size:16px;color:#64748b">ไม่พบข้อมูล</span></div>';
        return;
    }
    const total = studentsData.reduce((s,x) => s + x.debt, 0);
    const withDebt = studentsData.filter(s => s.debt > 0).length;
    document.getElementById('totalDebt').textContent = `฿${total.toLocaleString()}`;
    document.getElementById('debtCount').textContent = `${withDebt} คน`;
    document.getElementById('totalStudents').textContent = studentsData.length;
    renderTables();
}

function renderTables() {
    const byClass = {};
    studentsData.forEach(s => {
        if (!byClass[s.class]) byClass[s.class] = {};
        if (!byClass[s.class][s.room]) byClass[s.class][s.room] = [];
        byClass[s.class][s.room].push(s);
    });

    let html = '';
    Object.keys(byClass).sort((a,b) => (parseInt(a.replace(/\D/g,''))||0) - (parseInt(b.replace(/\D/g,''))||0)).forEach(cls => {
        const rooms = byClass[cls];
        const classTotal = Object.values(rooms).flat().reduce((s,x) => s + x.debt, 0);
        html += `<div class="class-section"><div class="class-header"><div class="class-title">🎓 ชั้น ${cls}</div><div class="class-total">฿${classTotal.toLocaleString()}</div></div><div class="room-grid">`;

        Object.keys(rooms).sort().forEach(room => {
            const students = rooms[room].sort((a,b) => (parseInt(a.code)||0) - (parseInt(b.code)||0));
            const roomTotal = students.reduce((s,x) => s + x.debt, 0);
            html += `<div class="room-card"><div class="room-header"><div class="room-name">🏫 ห้อง ${room}</div><div class="room-total">฿${roomTotal.toLocaleString()}</div></div><table class="stable"><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ-สกุล</th><th style="text-align:right">ยอดหนี้</th></tr></thead><tbody>`;

            students.forEach((s, i) => {
                const rc = s.debt > 500 ? 'debt-red' : s.debt > 300 ? 'debt-orange' : s.debt > 0 ? 'debt-yellow' : '';
                html += `<tr class="${rc}" onclick="openModal('${s.code}','${s.name.replace(/'/g,"\\'")}','${s.debt}','${cls}','${room}')"><td>${i+1}</td><td class="code">${s.code}</td><td>${s.name}</td><td class="debt">฿${s.debt.toLocaleString()}</td></tr>`;
            });
            html += '</tbody></table></div>';
        });
        html += '</div></div>';
    });
    document.getElementById('content').innerHTML = html;
}

document.getElementById('searchBox').addEventListener('input', filterAndUpdate);

function syncData() {
    const btn = document.querySelector('.sync-btn');
    btn?.classList.add('syncing');
    isLoading = false;
    loadData();
    setTimeout(() => btn?.classList.remove('syncing'), 1000);
}

// ==================== MODAL ====================
function openModal(code, name, debt, cls, room) {
    currentStudent = { code, name, debt: parseFloat(debt)||0, class: cls, room };
    document.getElementById('mName').textContent = name;
    document.getElementById('mDebt').textContent = `฿${currentStudent.debt.toLocaleString()}`;
    document.getElementById('mCode').textContent = code;
    document.getElementById('mClass').textContent = `${cls} / ${room}`;
    document.getElementById('studentModal').classList.add('active');

    // Reset tabs
    switchTab('purchases');

    // Init calendar to current month
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    purchaseDates = {};

    loadPurchases(code);
    loadPayments(code);
}

function closeModal() {
    document.getElementById('studentModal').classList.remove('active');
    currentStudent = null;
}
document.getElementById('studentModal').addEventListener('click', e => { if(e.target.id==='studentModal') closeModal(); });

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => {
        t.classList.toggle('active', (tab==='purchases' && i===0) || (tab==='payments' && i===1));
    });
    document.getElementById('tab-purchases').classList.toggle('active', tab==='purchases');
    document.getElementById('tab-payments').classList.toggle('active', tab==='payments');
}

// ==================== CALENDAR ====================
function renderCalendar(salesByDate) {
    const today = new Date();
    const first = new Date(calYear, calMonth, 1);
    const last = new Date(calYear, calMonth + 1, 0);
    const startDay = first.getDay(); // 0=Sun
    const daysInMonth = last.getDate();

    const monthNames = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const dayNames = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    let h = `<div class="cal-nav">
        <button data-month-delta="-1">◀</button>
        <span class="month-label">${monthNames[calMonth]} ${calYear + 543}</span>
        <button data-month-delta="1">▶</button>
    </div>`;
    h += '<div class="cal-grid">';
    dayNames.forEach(d => h += `<div class="cal-day-name">${d}</div>`);

    // Empty cells
    for (let i = 0; i < startDay; i++) h += '<div class="cal-day empty"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hasData = salesByDate && salesByDate[dateKey] && salesByDate[dateKey].length > 0;
        const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
        const classes = ['cal-day'];
        if (hasData) classes.push('has-data');
        if (isToday) classes.push('today');

        h += `<div class="${classes.join(' ')}" data-date="${dateKey}">${d}</div>`;
    }
    h += '</div>';
    const container = document.getElementById('calendarContainer');
    container.innerHTML = h;
    
    // Setup event listeners after render
    setupCalendarEventDelegation();
}

function changeMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar(purchaseDates);
}

// Calendar event handler (keep reference for removal)
let calendarClickHandler = null;
let calendarTouchHandler = null;

// Setup event delegation for calendar clicks (works after re-render)
function setupCalendarEventDelegation() {
    const container = document.getElementById('calendarContainer');
    if (!container) return;
    
    // Remove old listeners if they exist
    if (calendarClickHandler) {
        container.removeEventListener('click', calendarClickHandler, false);
    }
    if (calendarTouchHandler) {
        container.removeEventListener('touchend', calendarTouchHandler);
    }
    
    // Create new handlers
    calendarClickHandler = function(e) { handleCalendarClick(e); };
    calendarTouchHandler = function(e) { handleCalendarClick(e); };
    
    // Add new event listeners
    container.addEventListener('click', calendarClickHandler, false);
    container.addEventListener('touchend', calendarTouchHandler, { passive: false });
}

function handleCalendarClick(e) {
    // Prevent default for touch events
    if (e.type === 'touchend') {
        e.preventDefault();
    }
    
    // Handle month navigation buttons
    const monthBtn = e.target.closest('button[data-month-delta]');
    if (monthBtn) {
        e.stopPropagation();
        const delta = parseInt(monthBtn.getAttribute('data-month-delta'));
        changeMonth(delta);
        return;
    }
    
    // Handle calendar day selection
    const calDay = e.target.closest('.cal-day');
    if (!calDay || calDay.classList.contains('empty')) return;
    
    const dateKey = calDay.getAttribute('data-date');
    if (dateKey) {
        e.stopPropagation();
        selectDate(dateKey);
    }
}

function selectDate(dateKey) {
    // Highlight
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    const targetEl = document.querySelector(`.cal-day[data-date="${dateKey}"]`);
    if (targetEl) targetEl.classList.add('selected');

    const items = purchaseDates[dateKey] || [];
    let h = `<div class="selected-date-label">📅 ${formatDateThai(dateKey)}</div>`;

    if (items.length === 0) {
        h += '<div class="hist-empty">ไม่มีรายการในวันนี้</div>';
    } else {
        const dayTotal = items.reduce((s,x) => s + (parseFloat(x.amount)||0), 0);
        h += `<div class="hist-summary"><div style="font-size:12px;opacity:0.9">ยอดซื้อวันนี้</div><div style="font-size:1.6em;font-weight:bold">฿${dayTotal.toLocaleString()}</div><div style="font-size:12px;opacity:0.8">${items.length} รายการ</div></div>`;

        items.forEach(item => {
            const t = item.time || '';
            const product = item.product || item.item || '';
            const amount = parseFloat(item.amount) || 0;
            
            h += `<div class="hist-item">
                <div style="width:100%">
                    <div class="hist-amount">฿${amount.toLocaleString()}</div>`;
            
            // ⭐ ถ้ามีรายละเอียดสินค้า แสดงเป็นตาราง
            if (product && product !== 'สินค้า' && product !== 'สินค้าทั่วไป') {
                // แยกสินค้าที่ซื้อหลายรายการ (คั่นด้วยจุลภาค)
                const productList = product.split(',').map(p => p.trim()).filter(p => p);
                
                if (productList.length > 0) {
                    // ⭐ คำนวณราคาเฉลี่ยต่อรายการ (ถ้ามีหลายรายการ)
                    const pricePerItem = productList.length > 1 ? amount / productList.length : amount;
                    
                    h += `<table class="product-table">
                        <thead>
                            <tr>
                                <th>รายการ</th>
                                <th>ราคา</th>
                            </tr>
                        </thead>
                        <tbody>`;
                    
                    productList.forEach(prod => {
                        h += `<tr>
                            <td>${prod}</td>
                            <td>฿${pricePerItem.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2})}</td>
                        </tr>`;
                    });
                    
                    h += `</tbody></table>`;
                    
                    // แสดงยอดรวม
                    h += `<div class="product-total">
                        <span class="label">รวมทั้งหมด</span>
                        <span class="value">฿${amount.toLocaleString()}</span>
                    </div>`;
                }
            }
            
            h += `<div class="hist-meta">⏰ ${t}</div>
                </div>
            </div>`;
        });
    }
    document.getElementById('purchaseList').innerHTML = h;
}

function formatDateThai(dateKey) {
    const [y,m,d] = dateKey.split('-');
    const months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${parseInt(d)} ${months[parseInt(m)]} ${parseInt(y)+543}`;
}

// ==================== LOAD HISTORY ====================
async function loadPurchases(code) {
    const list = document.getElementById('purchaseList');
    list.innerHTML = '<div class="hist-empty"><div class="spinner"></div>กำลังโหลด...</div>';

    try {
        const r = await fetch(webAppUrl + `?action=getSalesHistory&studentCode=${code}&t=` + Date.now());
        const res = await r.json();

        if (res.success && res.history && res.history.length > 0) {
            // Group by date
            purchaseDates = {};
            res.history.forEach(item => {
                const dt = new Date(item.datetime || item.timestamp || item.date);
                const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
                if (!purchaseDates[key]) purchaseDates[key] = [];
                purchaseDates[key].push({
                    amount: item.amount || item.price || 0,
                    time: dt.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'}),
                    product: item.product || item.item || item.name || '',
                    date: key
                });
            });

            renderCalendar(purchaseDates);

            // Auto-select today or latest date
            const todayKey = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
            const latestDate = Object.keys(purchaseDates).sort().pop();
            const selectKey = purchaseDates[todayKey] ? todayKey : latestDate;

            if (selectKey) {
                // Navigate to that month
                const [sy, sm] = selectKey.split('-');
                calYear = parseInt(sy);
                calMonth = parseInt(sm) - 1;
                renderCalendar(purchaseDates);
                selectDate(selectKey);
                // Highlight in calendar
                document.querySelectorAll('.cal-day').forEach(el => {
                    if (el.textContent == parseInt(selectKey.split('-')[2])) el.classList.add('selected');
                });
            }

            // Show total summary
            const total = res.history.reduce((s,x) => s + (parseFloat(x.amount||x.price)||0), 0);
            list.insertAdjacentHTML('afterbegin', `<div class="hist-summary"><div style="font-size:12px;opacity:0.9">ยอดซื้อทั้งหมด</div><div style="font-size:1.6em;font-weight:bold">฿${total.toLocaleString()}</div><div style="font-size:12px;opacity:0.8">${res.history.length} รายการ</div></div>`);

        } else {
            renderCalendar({});
            list.innerHTML = '<div class="hist-empty">🛒 ยังไม่มีประวัติการซื้อ</div>';
        }
    } catch(e) {
        console.error('Sales history error:', e);
        renderCalendar({});
        list.innerHTML = `<div class="hist-empty">⚠️ ไม่สามารถโหลดข้อมูลได้<br><small style="color:var(--muted)">ตรวจสอบ Google Apps Script (action=getSalesHistory)</small><br><button onclick="loadPurchases('${code}')" style="margin-top:10px;padding:6px 14px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer">🔄 ลองใหม่</button></div>`;
    }
}

async function loadPayments(code) {
    const list = document.getElementById('paymentList');
    list.innerHTML = '<div class="hist-empty"><div class="spinner"></div>กำลังโหลด...</div>';

    try {
        const r = await fetch(webAppUrl + `?action=getPaymentHistory&studentCode=${code}&t=` + Date.now());
        const res = await r.json();

        if (res.success && res.history && res.history.length > 0) {
            let h = '';
            let totalPaid = 0;
            res.history.reverse().forEach(p => {
                const dt = new Date(p.datetime || p.timestamp || p.date);
                const dateStr = dt.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'});
                const timeStr = dt.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
                const amt = parseFloat(p.amount) || 0;
                totalPaid += amt;
                const method = p.method || p.type || '';

                h += `<div class="hist-item payment">
                    <div>
                        <div class="hist-amount payment">฿${amt.toLocaleString()}</div>
                        ${method ? `<div class="hist-meta" style="color:var(--text);margin-top:2px">${method}</div>` : ''}
                        <div class="hist-meta">📅 ${dateStr} ⏰ ${timeStr}</div>
                    </div>
                </div>`;
            });

            h = `<div style="background:linear-gradient(135deg,var(--green),#059669);padding:12px;border-radius:8px;text-align:center;margin-bottom:12px;color:white">
                <div style="font-size:12px;opacity:0.9">ชำระแล้วทั้งหมด</div>
                <div style="font-size:1.6em;font-weight:bold">฿${totalPaid.toLocaleString()}</div>
                <div style="font-size:12px;opacity:0.8">${res.history.length} ครั้ง</div>
            </div>` + h;

            list.innerHTML = h;
        } else {
            list.innerHTML = '<div class="hist-empty">💳 ยังไม่มีประวัติการชำระเงิน</div>';
        }
    } catch(e) {
        console.error('Payment history error:', e);
        list.innerHTML = `<div class="hist-empty">⚠️ ไม่สามารถโหลดข้อมูลได้<br><small style="color:var(--muted)">ตรวจสอบ Google Apps Script (action=getPaymentHistory)</small><br><button onclick="loadPayments('${code}')" style="margin-top:10px;padding:6px 14px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer">🔄 ลองใหม่</button></div>`;
    }
}
