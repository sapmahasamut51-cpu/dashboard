<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Dashboard ยอดขาย</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 10px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            animation: slideDown 0.5s ease;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .last-sync {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #94a3b8;
        }

        .card-icon {
            font-size: 24px;
        }

        .card-amount {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-count {
            font-size: 14px;
            color: #94a3b8;
        }

        .today-card {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }

        .month-card {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        }

        .total-card {
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            padding: 12px 24px;
            background: #1e293b;
            border: none;
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .tab.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            transform: scale(1.05);
        }

        .tab:hover:not(.active) {
            background: #334155;
            color: #e2e8f0;
        }

        /* Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Class Cards */
        .class-grid {
            display: grid;
            gap: 15px;
        }

        .class-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #334155;
        }

        .class-name {
            font-size: 20px;
            font-weight: bold;
            color: #6366f1;
        }

        .class-total {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
        }

        /* Room Grid */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .room-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .room-card:hover {
            background: #334155;
            transform: scale(1.05);
        }

        .room-name {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .room-amount {
            font-size: 20px;
            font-weight: bold;
            color: #f59e0b;
        }

        .room-count {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        /* Student List */
        .student-list {
            margin-top: 15px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .student-list.show {
            display: block;
        }

        .student-item {
            background: #0f172a;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .student-item:hover {
            background: #1e293b;
            transform: translateX(5px);
        }

        .student-name {
            font-size: 14px;
            color: #e2e8f0;
        }

        .student-amount {
            font-size: 16px;
            font-weight: bold;
            color: #10b981;
        }

        /* Sync Button */
        .sync-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .sync-btn:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.7);
        }

        .sync-btn.syncing {
            animation: spin 1s linear infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #6366f1;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }

            .card-amount {
                font-size: 28px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .room-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏪 Dashboard ยอดขาย</h1>
            <div class="last-sync" id="lastSync">กำลังโหลดข้อมูล...</div>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="card today-card">
                <div class="card-header">
                    <span class="card-icon">📅</span>
                    <span>ยอดขายวันนี้</span>
                </div>
                <div class="card-amount" id="todayTotal">฿0</div>
                <div class="card-count" id="todayCount">0 รายการ</div>
            </div>

            <div class="card month-card">
                <div class="card-header">
                    <span class="card-icon">📆</span>
                    <span>ยอดขายเดือนนี้</span>
                </div>
                <div class="card-amount" id="monthTotal">฿0</div>
                <div class="card-count" id="monthCount">0 รายการ</div>
            </div>

            <div class="card total-card">
                <div class="card-header">
                    <span class="card-icon">💰</span>
                    <span>ยอดรวมทั้งหมด</span>
                </div>
                <div class="card-amount" id="totalAll">฿0</div>
                <div class="card-count" id="totalCount">0 รายการ</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('today')">📅 วันนี้</button>
            <button class="tab" onclick="switchTab('month')">📆 เดือนนี้</button>
            <button class="tab" onclick="switchTab('all')">💼 ทั้งหมด</button>
        </div>

        <!-- Tab Content -->
        <div id="todayContent" class="tab-content active">
            <div id="todayClasses"></div>
        </div>

        <div id="monthContent" class="tab-content">
            <div id="monthClasses"></div>
        </div>

        <div id="allContent" class="tab-content">
            <div id="allClasses"></div>
        </div>

        <!-- Sync Button -->
        <button class="sync-btn" onclick="syncData()" title="รีเฟรชข้อมูล">
            🔄
        </button>
    </div>

    <script>
        let salesData = [];
        let studentsData = {};

        // ฟังก์ชันโหลดข้อมูลจาก localStorage
        function loadData() {
            const saved = localStorage.getItem('salesHistory');
            const savedStudents = localStorage.getItem('studentsData');
            
            if (saved) {
                salesData = JSON.parse(saved);
            } else {
                // ข้อมูลตัวอย่าง
                salesData = generateSampleData();
                localStorage.setItem('salesHistory', JSON.stringify(salesData));
            }

            if (savedStudents) {
                studentsData = JSON.parse(savedStudents);
            } else {
                studentsData = {
                    "1234": {"name": "ด.ช.สมชาย ใจดี", "class": "ม.1", "room": "1"},
                    "2345": {"name": "ด.ญ.สมหญิง เรียบร้อย", "class": "ม.1", "room": "2"},
                    "3456": {"name": "นายอนันต์ ตั้งใจเรียน", "class": "ม.2", "room": "1"},
                    "4567": {"name": "น.ส.กมลวรรณ ขยันมาก", "class": "ม.2", "room": "3"}
                };
                localStorage.setItem('studentsData', JSON.stringify(studentsData));
            }

            updateDashboard();
        }

        // สร้างข้อมูลตัวอย่าง
        function generateSampleData() {
            const data = [];
            const today = new Date();
            
            for (let i = 0; i < 20; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - Math.floor(Math.random() * 30));
                
                const codes = ["1234", "2345", "3456", "4567"];
                const code = codes[Math.floor(Math.random() * codes.length)];
                const student = studentsData[code] || studentsData["1234"];
                
                data.push({
                    code: code,
                    name: student.name,
                    class: student.class,
                    room: student.room,
                    price: (Math.floor(Math.random() * 10) + 1) * 10,
                    time: `${String(Math.floor(Math.random() * 12) + 8).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}:00`,
                    date: `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`
                });
            }
            
            return data;
        }

        // อัพเดท Dashboard
        function updateDashboard() {
            const today = new Date();
            const todayStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
            const monthStr = `${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;

            // คำนวณยอดรวม
            const todayData = salesData.filter(s => s.date === todayStr);
            const monthData = salesData.filter(s => s.date.endsWith(monthStr));

            const todayTotal = todayData.reduce((sum, s) => sum + parseInt(s.price), 0);
            const monthTotal = monthData.reduce((sum, s) => sum + parseInt(s.price), 0);
            const allTotal = salesData.reduce((sum, s) => sum + parseInt(s.price), 0);

            // อัพเดทการ์ดสรุป
            document.getElementById('todayTotal').textContent = `฿${todayTotal.toLocaleString()}`;
            document.getElementById('todayCount').textContent = `${todayData.length} รายการ`;
            
            document.getElementById('monthTotal').textContent = `฿${monthTotal.toLocaleString()}`;
            document.getElementById('monthCount').textContent = `${monthData.length} รายการ`;
            
            document.getElementById('totalAll').textContent = `฿${allTotal.toLocaleString()}`;
            document.getElementById('totalCount').textContent = `${salesData.length} รายการ`;

            // อัพเดทแต่ละแท็บ
            renderClassData('todayClasses', todayData);
            renderClassData('monthClasses', monthData);
            renderClassData('allClasses', salesData);

            // อัพเดทเวลา sync
            document.getElementById('lastSync').textContent = `อัพเดทล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
        }

        // แสดงข้อมูลแยกตามชั้น
        function renderClassData(elementId, data) {
            const element = document.getElementById(elementId);
            
            if (data.length === 0) {
                element.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>ยังไม่มีข้อมูลการขาย</div>
                    </div>
                `;
                return;
            }

            // จัดกลุ่มข้อมูลตามชั้น
            const byClass = {};
            data.forEach(sale => {
                if (!byClass[sale.class]) {
                    byClass[sale.class] = {};
                }
                if (!byClass[sale.class][sale.room]) {
                    byClass[sale.class][sale.room] = [];
                }
                byClass[sale.class][sale.room].push(sale);
            });

            let html = '<div class="class-grid">';
            
            Object.keys(byClass).sort().forEach(className => {
                const classTotal = Object.values(byClass[className])
                    .flat()
                    .reduce((sum, s) => sum + parseInt(s.price), 0);
                
                const classCount = Object.values(byClass[className]).flat().length;

                html += `
                    <div class="class-card">
                        <div class="class-header">
                            <div class="class-name">🎓 ${className}</div>
                            <div class="class-total">฿${classTotal.toLocaleString()}</div>
                        </div>
                        <div class="room-grid">
                `;

                Object.keys(byClass[className]).sort().forEach(room => {
                    const roomData = byClass[className][room];
                    const roomTotal = roomData.reduce((sum, s) => sum + parseInt(s.price), 0);
                    const roomCount = roomData.length;

                    // จัดกลุ่มตามนักเรียน
                    const byStudent = {};
                    roomData.forEach(sale => {
                        if (!byStudent[sale.code]) {
                            byStudent[sale.code] = {
                                name: sale.name,
                                total: 0,
                                count: 0
                            };
                        }
                        byStudent[sale.code].total += parseInt(sale.price);
                        byStudent[sale.code].count++;
                    });

                    const studentListHtml = Object.entries(byStudent)
                        .sort((a, b) => b[1].total - a[1].total)
                        .map(([code, student]) => `
                            <div class="student-item">
                                <div class="student-name">${student.name} (${student.count})</div>
                                <div class="student-amount">฿${student.total.toLocaleString()}</div>
                            </div>
                        `).join('');

                    html += `
                        <div class="room-card" onclick="toggleStudents('${className}-${room}-${elementId}')">
                            <div class="room-name">ห้อง ${room}</div>
                            <div class="room-amount">฿${roomTotal.toLocaleString()}</div>
                            <div class="room-count">${roomCount} รายการ</div>
                        </div>
                    `;

                    // เพิ่มรายชื่อนักเรียนซ่อนไว้
                    html += `
                        <div id="${className}-${room}-${elementId}" class="student-list" style="grid-column: 1 / -1;">
                            ${studentListHtml}
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            element.innerHTML = html;
        }

        // Toggle แสดง/ซ่อนรายชื่อนักเรียน
        function toggleStudents(id) {
            const element = document.getElementById(id);
            element.classList.toggle('show');
        }

        // สลับแท็บ
        function switchTab(tab) {
            // อัพเดทปุ่มแท็บ
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // แสดง/ซ่อนเนื้อหา
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Content').classList.add('active');
        }

        // Sync ข้อมูล
        function syncData() {
            const btn = document.querySelector('.sync-btn');
            btn.classList.add('syncing');
            
            setTimeout(() => {
                loadData();
                btn.classList.remove('syncing');
            }, 1000);
        }

        // โหลดข้อมูลตอนเริ่มต้น
        window.addEventListener('load', loadData);

        // Auto refresh ทุก 30 วินาที
        setInterval(() => {
            loadData();
        }, 30000);
    </script>
</body>

</html>
